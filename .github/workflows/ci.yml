name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      cache:
        description: "Use build caches. Uncheck for a clean cold build."
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (MSVC x64)
            os: windows-2022
            preset: windows-msvc
          - name: Linux (GCC)
            os: ubuntu-24.04
            preset: linux

    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      USE_CACHE: ${{ github.event_name != 'workflow_dispatch' || inputs.cache }}
      VCPKG_BINARY_SOURCES: "${{ (github.event_name != 'workflow_dispatch' || inputs.cache) && 'clear;default,readwrite' || 'clear' }}"
      SCCACHE_GHA_ENABLED: "false"
      SCCACHE_DIR: ${{ github.workspace }}/.sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install sccache (Linux)
        if: runner.os == 'Linux' && env.USE_CACHE == 'true'
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Cache sccache objects (Linux)
        if: runner.os == 'Linux' && env.USE_CACHE == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: ${{ runner.os }}-sccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-sccache-

      - name: Cache vcpkg binary packages
        if: env.USE_CACHE == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ runner.os }}-vcpkgbin-${{ hashFiles('vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-vcpkgbin-${{ hashFiles('vcpkg.json') }}-

      - name: Create vcpkg binary cache dir
        shell: bash
        run: mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Restore vcpkg (clone + bootstrap)
        id: restore-vcpkg
        if: env.USE_CACHE == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg
        if: steps.restore-vcpkg.outputs.cache-hit != 'true'
        shell: bash
        run: |
          baseline=$(node -e "process.stdout.write(require('./vcpkg.json')['builtin-baseline'])")
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$baseline"
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          else
            "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          fi

      - name: Save vcpkg (bootstrap only)
        if: env.USE_CACHE == 'true' && steps.restore-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}

      - name: Configure
        shell: bash
        run: |
          EXTRA=""
          if [ "$RUNNER_OS" = "Linux" ] && [ "$USE_CACHE" = "true" ]; then
            EXTRA="-DCMAKE_CXX_COMPILER_LAUNCHER=sccache"
          fi
          cmake --preset ${{ matrix.preset }} $EXTRA

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: sccache stats (Linux)
        if: runner.os == 'Linux' && env.USE_CACHE == 'true'
        run: sccache --show-stats
